<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Joe Heffer</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://heffer.info/" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="assets/site.webmanifest" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <meta name="theme-color" content="#0b0b12" />

  <style>
    .notfound-hero { min-height: 100svh; }
    .notfound-brand { display: inline-flex; margin-bottom: 2rem; }
  </style>

  <!-- Set theme before first paint to avoid a flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <main id="main">
    <section class="hero notfound-hero" aria-labelledby="notfound-title">
      <div class="hero__bg" aria-hidden="true">
        <span class="hero__orb hero__orb--1"></span>
        <span class="hero__orb hero__orb--2"></span>
        <span class="hero__grid"></span>
      </div>

      <div class="hero__content container">
        <a class="nav__brand notfound-brand" href="/" aria-label="Joe Heffer — home">
          <span class="nav__monogram" aria-hidden="true">JH</span>
        </a>

        <p class="hero__eyebrow">404</p>
        <h1 class="hero__title" id="notfound-title">
          Page <span class="grad">not found</span>
        </h1>
        <p class="hero__tagline">
          The page you're looking for doesn't exist, or may have moved.
        </p>

        <div class="hero__cta">
          <a class="btn btn--primary" href="/">Back to home</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
